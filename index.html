<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>민우 자료실</title>
<meta name="description" content="발표했던 자료를 정리해 공유하는 자료실">
<meta property="og:type" content="website">
<meta property="og:site_name" content="민우 자료실">
<meta property="og:title" content="민우 자료실">
<meta property="og:description" content="발표했던 자료를 정리해 공유하는 자료실">
<meta property="og:url" content="https://minw1540.github.io/">
<meta property="og:image" content="https://minw1540.github.io/aitop100-prelim/assets/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<style>
:root {
  --bg: #FFFFFF;
  --text: rgb(55, 53, 47);
  --sub: rgba(55, 53, 47, 0.65);
  --faint: rgba(55, 53, 47, 0.45);
  --line: rgba(55, 53, 47, 0.09);
  --hover: rgba(55, 53, 47, 0.06);
  --card: #FFFFFF;
  --callout: rgb(241, 241, 239);
  --cover: rgb(233, 229, 227);
  --tag-brown-bg: rgb(238, 224, 218); --tag-brown: rgb(68, 42, 30);
  --tag-blue-bg: rgb(211, 229, 239);  --tag-blue: rgb(24, 51, 71);
  --tag-gray-bg: rgb(227, 226, 224);  --tag-gray: rgb(50, 48, 44);
  --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", Helvetica, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #191919;
    --text: rgba(255, 255, 255, 0.81);
    --sub: rgba(255, 255, 255, 0.55);
    --faint: rgba(255, 255, 255, 0.38);
    --line: rgba(255, 255, 255, 0.09);
    --hover: rgba(255, 255, 255, 0.055);
    --card: #202020;
    --callout: rgb(37, 37, 37);
    --cover: rgb(47, 44, 42);
    --tag-brown-bg: rgb(74, 50, 40);  --tag-brown: rgb(233, 210, 198);
    --tag-blue-bg: rgb(40, 69, 108);  --tag-blue: rgb(210, 228, 245);
    --tag-gray-bg: rgb(55, 55, 55);   --tag-gray: rgb(225, 225, 222);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
a { color: inherit; }

.cover { height: 30vh; max-height: 260px; min-height: 140px; background: var(--cover); }
.page { max-width: 900px; margin: 0 auto; padding: 0 96px 120px; }
.icon { display: block; font-size: 78px; line-height: 1; margin-top: -42px; }
h1 { margin: 24px 0 8px; font-size: 40px; font-weight: 700; line-height: 1.2; letter-spacing: -0.01em; }

.props { margin: 16px 0 8px; display: grid; grid-template-columns: 160px minmax(0, 1fr); row-gap: 2px; font-size: 14px; }
.props dt { color: var(--faint); padding: 5px 0; }
.props dd { margin: 0; padding: 5px 0; }

.callout { display: flex; gap: 10px; margin: 24px 0 40px; padding: 16px 16px 16px 12px; background: var(--callout); border-radius: 4px; font-size: 15px; line-height: 1.7; }
.callout .emoji { flex: none; font-size: 20px; line-height: 1.4; }
kbd { font: 500 12px/1 var(--font); padding: 2px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--bg); }

.db-head { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--line); }
.db-title { margin: 0 12px 0 0; font-size: 20px; font-weight: 700; }
/* 보기 전환은 스크립트 없이 라디오 단추로 한다 */
.views { display: flex; gap: 4px; }
.views input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.view { display: inline-flex; align-items: center; padding: 8px 8px 9px; margin-bottom: -1px; border-bottom: 2px solid transparent; color: var(--sub); font: 500 14px var(--font); cursor: pointer; user-select: none; }
.view:hover { color: var(--text); }
.views input:checked + .view { color: var(--text); border-bottom-color: var(--text); }
.views input:focus-visible + .view, .gallery a:focus-visible, .table a:focus-visible { outline: 2px solid rgb(35, 131, 226); outline-offset: 2px; border-radius: 4px; }
#view-table { display: none; }
.db:has(#v-table:checked) #view-table { display: block; }
.db:has(#v-table:checked) #view-gallery { display: none; }

.gallery { list-style: none; margin: 16px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 16px; }
.gallery a { display: block; height: 100%; text-decoration: none; background: var(--card); border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 1px var(--line), 0 2px 4px var(--line); }
.gallery a:hover { background: var(--hover); }
.gallery img { display: block; width: 100%; aspect-ratio: 1200 / 630; object-fit: cover; border-bottom: 1px solid var(--line); }
.gallery .body { padding: 10px 12px 12px; }
.gallery .name { margin: 0 0 8px; font-size: 14px; font-weight: 600; }
.gallery .meta { display: flex; flex-wrap: wrap; gap: 4px 6px; font-size: 12px; color: var(--sub); align-items: center; }

.tag { display: inline-block; padding: 0 6px; border-radius: 3px; font-size: 12px; line-height: 20px; white-space: nowrap; }
.tag.brown { background: var(--tag-brown-bg); color: var(--tag-brown); }
.tag.blue { background: var(--tag-blue-bg); color: var(--tag-blue); }
.tag.gray { background: var(--tag-gray-bg); color: var(--tag-gray); }

.table-wrap { margin-top: 8px; overflow-x: auto; }
.table { width: 100%; min-width: 640px; border-collapse: collapse; font-size: 14px; }
.table th { text-align: left; font-weight: 400; color: var(--sub); padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.table td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table tr:hover td { background: var(--hover); }
.table .num { color: var(--sub); font-variant-numeric: tabular-nums; width: 80px; }
.table a { font-weight: 600; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }

.count { margin: 10px 0 0; font-size: 12px; color: var(--faint); }

@media (max-width: 720px) {
  .page { padding: 0 16px 80px; }
  .icon { font-size: 64px; margin-top: -34px; }
  h1 { font-size: 32px; }
  .props { grid-template-columns: 110px minmax(0, 1fr); }
}
</style>
</head>
<body>
<div class="cover" role="presentation"></div>
<main class="page">
  <span class="icon" aria-hidden="true">🗂️</span>
  <h1>민우 자료실</h1>

  <dl class="props">
    <dt>무엇</dt><dd>발표했던 자료를 모아 둔 곳</dd>
  </dl>

  <div class="callout">
    <span class="emoji" aria-hidden="true">💡</span>
    <div>자료를 누르면 슬라이드가 열립니다. <kbd>←</kbd> <kbd>→</kbd>로 넘기고, <kbd>N</kbd>을 누르면 발표자 창이, <kbd>F</kbd>를 누르면 전체 화면이 열립니다.</div>
  </div>

  <section class="db" aria-labelledby="db-title">
    <div class="db-head">
      <h2 class="db-title" id="db-title">발표 자료</h2>
      <div class="views" role="radiogroup" aria-label="보기 방식">
        <input type="radio" name="view" id="v-gallery" checked><label class="view" for="v-gallery">갤러리</label>
        <input type="radio" name="view" id="v-table"><label class="view" for="v-table">표</label>
      </div>
    </div>

    <!-- 새 자료는 갤러리와 표 양쪽 맨 앞에 한 건씩 더한다. 등록번호는 이어서 매긴다 -->
    <div id="view-gallery">
      <ul class="gallery">
        <li>
          <a href="aitop100-prelim/">
            <img src="aitop100-prelim/assets/og.jpg" alt="">
            <div class="body">
              <p class="name">AI_TOP_100 예선 탈락썰</p>
              <div class="meta"><span class="tag brown">회고</span><span class="tag blue">AI 에이전트</span><span>2026년 11월 5일</span><span>25장</span></div>
            </div>
          </a>
        </li>
      </ul>
    </div>

    <div id="view-table">
      <div class="table-wrap">
        <table class="table">
          <thead><tr><th>등록번호</th><th>제목</th><th>분류</th><th>날짜</th><th>분량</th></tr></thead>
          <tbody>
            <tr>
              <td class="num">0001</td>
              <td><a href="aitop100-prelim/">AI_TOP_100 예선 탈락썰</a></td>
              <td><span class="tag brown">회고</span> <span class="tag blue">AI 에이전트</span></td>
              <td>2026-11-05</td>
              <td>슬라이드 25장</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <p class="count">1건</p>
  </section>
</main>
</body>
</html>
