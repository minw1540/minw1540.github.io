<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>minw1540 자료실</title>
<meta name="description" content="발표 자료와 정리 글을 공유하는 곳">
<style>
:root {
  --bg: #FAFAF7;
  --text: #1A1A1A;
  --sub: #6B6B6B;
  --line: #E4E2DC;
  --card: #FFFFFF;
  --accent: #C2410C;
  --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141414;
    --text: #EDEDED;
    --sub: #9A9A9A;
    --line: #2A2A2A;
    --card: #1C1C1C;
    --accent: #FB923C;
  }
}
:root[data-theme="dark"] {
  --bg: #141414;
  --text: #EDEDED;
  --sub: #9A9A9A;
  --line: #2A2A2A;
  --card: #1C1C1C;
  --accent: #FB923C;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 var(--font); }
main { max-width: 760px; margin: 0 auto; padding: 64px 16px 80px; }
h1 { margin: 0 0 6px; font-size: 32px; letter-spacing: -0.02em; }
.lead { margin: 0 0 40px; color: var(--sub); }
.list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.item a { display: grid; grid-template-columns: 96px 1fr; gap: 16px; padding: 22px 4px; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; }
.item a:hover .title, .item a:focus-visible .title { color: var(--accent); }
.date { color: var(--sub); font-variant-numeric: tabular-nums; padding-top: 2px; }
.title { margin: 0; font-size: 19px; font-weight: 700; }
.desc { margin: 4px 0 8px; color: var(--sub); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--sub); background: var(--card); }
footer { margin-top: 40px; color: var(--sub); font-size: 13px; }
@media (max-width: 520px) {
  .item a { grid-template-columns: 1fr; gap: 4px; }
}
</style>
</head>
<body>
<main>
  <h1>자료실</h1>
  <p class="lead">발표 자료와 정리 글을 공유합니다.</p>

  <!-- 새 자료는 폴더를 만들고 이 목록 맨 위에 항목 하나를 더한다 -->
  <ul class="list">
    <li class="item">
      <a href="aitop100-prelim/">
        <span class="date">2026-11-05</span>
        <span>
          <p class="title">AI_TOP_100 예선 탈락썰</p>
          <p class="desc">AI_TOP_100 2026 예선 참가 경험과 탈락 원인 공유</p>
          <span class="tags"><span class="tag">슬라이드</span><span class="tag">AI 에이전트</span><span class="tag">회고</span></span>
        </span>
      </a>
    </li>
  </ul>

  <footer>슬라이드는 방향키로 넘기고, N 을 누르면 발표자 창이 열립니다.</footer>
</main>
</body>
</html>
